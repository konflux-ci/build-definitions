---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-modelcar-oci-ta-mtime
spec:
  description: |
    Test similar to `test-modelcar-oci-ta-happy-path` for the modelcar-oci-ta task verifying that the mtime of model files is set from the OCI manifest created annotation
  workspaces:
    - name: tests-workspace
  tasks:
    - name: mock-trusted-artifact
      params:
        - name: ociStorage
          value: registry-service.kind-registry/oci-ta:latest
        - name: modelPath
          value: registry-service.kind-registry/test-model:latest
        - name: caTrustConfigMapName
          value: trusted-ca
        - name: caTrustConfigMapKey
          value: ca-bundle.crt
      taskSpec:
        results:
        - name: MODEL_PATH
          type: string
        - name: SOURCE_ARTIFACT
          type: string
        workspaces:
          - name: tests-workspace
        volumes:
          - name: trusted-ca
            configMap:
              items:
                - key: $(params.caTrustConfigMapKey)
                  path: ca-bundle.crt
              name: $(params.caTrustConfigMapName)
        params:
          - name: ociStorage
          - name: modelPath
        stepTemplate:
          volumeMounts:
            - name: trusted-ca
              mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
        steps:
          - name: mock-source
            image: quay.io/konflux-ci/task-runner:3.1.2@sha256:e272c1e1c60a4ecc72ff9c8d65bc48da534de6f1ce0d5aba79db3ac532d11c35
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Create a simple source directory with a modelcard.yaml file
              mkdir -p "$(workspaces.tests-workspace.path)/source"
              cat > "$(workspaces.tests-workspace.path)/source/modelcard.yaml" << 'EOF'
              name: test-model
              version: 1.0.0
              description: Test model for modelcar task
              framework: test
              EOF

              # Create some additional test files
              echo "test content" > "$(workspaces.tests-workspace.path)/source/test.txt"
              echo "model data" > "$(workspaces.tests-workspace.path)/source/model.bin"

              echo "Created source directory with test files:"
              ls -la "$(workspaces.tests-workspace.path)/source"
              find "$(workspaces.tests-workspace.path)/source" -type f -exec echo "  {}" \;
          - name: mock-model
            image: quay.io/konflux-ci/task-runner:3.1.2@sha256:e272c1e1c60a4ecc72ff9c8d65bc48da534de6f1ce0d5aba79db3ac532d11c35
            workingDir: $(workspaces.tests-workspace.path)
            env:
              - name: MODEL_PATH
                value: $(params.modelPath)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              # Kind registry uses a cluster-local CA that is not reliably in
              # the task trust store under deploy-local CI; skip verify here.
              # Push from inside source/ so layer titles are paths relative to
              # the model root (e.g. model.bin), not source/model.bin.
              # With --root-dir models, files land under /models/<title>.
              mapfile -t files < <(find source -type f -printf '%P\n' | sort)
              (
                cd source
                oras push --insecure --no-tty \
                  --annotation "org.opencontainers.image.created=2026-03-13T10:30:00Z" \
                  "${MODEL_PATH}" "${files[@]}"
              )
          - name: record-model-digest
            image: quay.io/konflux-ci/task-runner:3.1.2@sha256:e272c1e1c60a4ecc72ff9c8d65bc48da534de6f1ce0d5aba79db3ac532d11c35
            env:
              - name: MODEL_PATH
                value: $(params.modelPath)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Find digest of the mocked model"
              digest=$(oras resolve --insecure "${MODEL_PATH}")

              echo "Share location of the mocked model"
              echo -n "${MODEL_PATH}@${digest}" > "$(results.MODEL_PATH.path)"
          - name: create-trusted-artifact
            image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:a61ef5dfee9a8720f7bc2d1d52001057ca6a22d2ddbae0db175b11d9ab95105a
            env:
              # Consumed by oras_opts.sh inside build-trusted-artifacts.
              - name: ORAS_OPTIONS
                value: --insecure
              - name: CA_FILE
                value: /etc/pki/tls/certs/ca-custom-bundle.crt
            args:
              - create
              - --store
              - $(params.ociStorage)
              - $(results.SOURCE_ARTIFACT.path)=$(workspaces.tests-workspace.path)/source
    - name: run-modelcar-task
      taskRef:
        name: modelcar-oci-ta
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.mock-trusted-artifact.results.SOURCE_ARTIFACT)
        - name: BASE_IMAGE
          value: "registry.access.redhat.com/ubi9/ubi@sha256:d0ef82ed2d57e186fc1fa10cab62309e8c5ae7d1d7adbbcdefee6ae5e72ecc4e"
        - name: MODEL_IMAGE
          value: $(tasks.mock-trusted-artifact.results.MODEL_PATH)
        - name: IMAGE
          value: registry-service.kind-registry/test-modelcar:latest
        - name: SBOM_TYPE
          value: "spdx"
        - name: MODELCARD_PATH
          value: "/var/workdir/source/modelcard.yaml"
        - name: REMOVE_ORIGINALS
          value: "true"
        - name: MODEL_IMAGE_AUTH
          value: "dummy-secret"
        - name: caTrustConfigMapName
          value: trusted-ca
        - name: caTrustConfigMapKey
          value: ca-bundle.crt
      runAfter:
        - mock-trusted-artifact
    - name: verify-modelcar-result
      params:
        - name: IMAGE_REF
          value: $(tasks.run-modelcar-task.results.IMAGE_REF)
        - name: caTrustConfigMapName
          value: trusted-ca
        - name: caTrustConfigMapKey
          value: ca-bundle.crt
      taskSpec:
        params:
          - name: IMAGE_REF
        volumes:
          - name: trusted-ca
            configMap:
              items:
                - key: $(params.caTrustConfigMapKey)
                  path: ca-bundle.crt
              name: $(params.caTrustConfigMapName)
        stepTemplate:
          volumeMounts:
            - name: trusted-ca
              mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
        steps:
          - name: check-mtime
            env:
              - name: IMAGE_REF
                value: $(params.IMAGE_REF)
            image: quay.io/konflux-ci/task-runner:3.1.2@sha256:e272c1e1c60a4ecc72ff9c8d65bc48da534de6f1ce0d5aba79db3ac532d11c35
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Extract the image filesystem"
              mkdir contents/ && pushd contents/
              oc image extract --insecure=true "$IMAGE_REF"

              echo "Confirm model files have the expected mtime from OCI annotation"
              # The annotation "org.opencontainers.image.created=2026-03-13T10:30:00Z"
              # is converted by the task to touch -t format: 202603131030.00
              # Expected: Mar 13 2026 10:30 UTC
              mtime=$(stat -c '%Y' models/model.bin)
              expected_epoch=1773397800
              if [ "$mtime" -ne "$expected_epoch" ]; then
                  echo "Expected mtime epoch $expected_epoch but got $mtime" && exit 1
              fi
              echo "Model file mtime matches the OCI annotation timestamp."
              popd
      runAfter:
        - run-modelcar-task
