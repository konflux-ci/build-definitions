---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-modelcar-oci-ta-alternative-arch
spec:
  description: |
    Test the modelcar-oci-ta task with a real base image, using a non-standard arch
  workspaces:
    - name: tests-workspace
  tasks:
    - name: mock-trusted-artifact
      params:
        - name: ociStorage
          value: registry-service.kind-registry/oci-ta:latest
        - name: modelPath
          value: registry-service.kind-registry/test-model:latest
        - name: caTrustConfigMapName
          value: trusted-ca
        - name: caTrustConfigMapKey
          value: ca-bundle.crt
      taskSpec:
        results:
        - name: MODEL_PATH
          type: string
        - name: SOURCE_ARTIFACT
          type: string
        workspaces:
          - name: tests-workspace
        volumes:
          - name: trusted-ca
            configMap:
              items:
                - key: $(params.caTrustConfigMapKey)
                  path: ca-bundle.crt
              name: $(params.caTrustConfigMapName)
        params:
          - name: ociStorage
          - name: modelPath
        stepTemplate:
          volumeMounts:
            - name: trusted-ca
              mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
        steps:
          - name: mock-source
            image: quay.io/konflux-ci/task-runner:3.1.1@sha256:790df1bb5ea7a9ce4c1717ff341398ff72c99faed1c2e939a3b4a15ff8f4a493
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Create a simple source directory with a modelcard.yaml file
              mkdir -p "$(workspaces.tests-workspace.path)/source"
              cat > "$(workspaces.tests-workspace.path)/source/modelcard.yaml" << 'EOF'
              name: test-model
              version: 1.0.0
              description: Test model for modelcar task
              framework: test
              EOF

              # Create some additional test files
              echo "test content" > "$(workspaces.tests-workspace.path)/source/test.txt"
              mkdir -p "$(workspaces.tests-workspace.path)/source/models"
              echo "model data" > "$(workspaces.tests-workspace.path)/source/models/model.bin"

              echo "Created source directory with test files:"
              ls -la "$(workspaces.tests-workspace.path)/source"
              find "$(workspaces.tests-workspace.path)/source" -type f -exec echo "  {}" \;
          - name: mock-model
            image: quay.io/konflux-ci/task-runner:3.1.1@sha256:790df1bb5ea7a9ce4c1717ff341398ff72c99faed1c2e939a3b4a15ff8f4a493
            workingDir: $(workspaces.tests-workspace.path)
            env:
              - name: MODEL_PATH
                value: $(params.modelPath)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              # Kind registry uses a cluster-local CA that is not reliably in
              # the task trust store under deploy-local CI; skip verify here.
              # Push files explicitly (directory push can collapse to one layer).
              # oras titles use basenames, so files land under /models/<basename>.
              mapfile -t files < <(find source -type f | sort)
              oras push --insecure --no-tty "${MODEL_PATH}" "${files[@]}"
          - name: record-model-digest
            image: quay.io/konflux-ci/task-runner:3.1.1@sha256:790df1bb5ea7a9ce4c1717ff341398ff72c99faed1c2e939a3b4a15ff8f4a493
            env:
              - name: MODEL_PATH
                value: $(params.modelPath)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Find digest of the mocked model"
              digest=$(oras resolve --insecure "${MODEL_PATH}")

              echo "Share location of the mocked model"
              echo -n "${MODEL_PATH}@${digest}" > "$(results.MODEL_PATH.path)"
          - name: create-trusted-artifact
            image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:0fa7f2a5cd87d6d47ac5dbedc81687805c8e6bc24c6aca620242e9134eed9633
            env:
              # Consumed by oras_opts.sh inside build-trusted-artifacts.
              - name: ORAS_OPTIONS
                value: --insecure
              - name: CA_FILE
                value: /etc/pki/tls/certs/ca-custom-bundle.crt
            args:
              - create
              - --store
              - $(params.ociStorage)
              - $(results.SOURCE_ARTIFACT.path)=$(workspaces.tests-workspace.path)/source
    - name: run-modelcar-task
      taskRef:
        name: modelcar-oci-ta
      params:
        - name: SOURCE_ARTIFACT
          value: $(tasks.mock-trusted-artifact.results.SOURCE_ARTIFACT)
        - name: BASE_IMAGE
          value: "registry.access.redhat.com/ubi9/ubi:latest@sha256:b68c21b2dd3e72abcf2f8dcfc77580e4030564d1243bfcb7cd64ccc5aa3e0a25"
        - name: PLATFORM
          value: linux/s390x
        - name: IMAGE_APPEND_PLATFORM
          value: "true"
        - name: MODEL_IMAGE
          value: $(tasks.mock-trusted-artifact.results.MODEL_PATH)
        - name: IMAGE
          value: registry-service.kind-registry/test-modelcar:latest
        - name: SBOM_TYPE
          value: "spdx"
        - name: MODELCARD_PATH
          value: "/var/workdir/source/modelcard.yaml"
        - name: REMOVE_ORIGINALS
          value: "true"
        - name: MODEL_IMAGE_AUTH
          value: "dummy-secret"
        - name: caTrustConfigMapName
          value: trusted-ca
        - name: caTrustConfigMapKey
          value: ca-bundle.crt
      runAfter:
        - mock-trusted-artifact
    - name: verify-modelcar-result
      params:
        - name: IMAGE_DIGEST
          value: $(tasks.run-modelcar-task.results.IMAGE_DIGEST)
        - name: IMAGE_REF
          value: $(tasks.run-modelcar-task.results.IMAGE_REF)
        - name: IMAGE_URL
          value: $(tasks.run-modelcar-task.results.IMAGE_URL)
        - name: SBOM_BLOB_URL
          value: $(tasks.run-modelcar-task.results.SBOM_BLOB_URL)
        - name: caTrustConfigMapName
          value: trusted-ca
        - name: caTrustConfigMapKey
          value: ca-bundle.crt
      taskSpec:
        params:
          - name: IMAGE_REF
          - name: IMAGE_URL
          - name: SBOM_BLOB_URL
        volumes:
          - name: trusted-ca
            configMap:
              items:
                - key: $(params.caTrustConfigMapKey)
                  path: ca-bundle.crt
              name: $(params.caTrustConfigMapName)
        stepTemplate:
          volumeMounts:
            - name: trusted-ca
              mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
              subPath: ca-bundle.crt
              readOnly: true
        steps:
          - name: check-modelcar-built
            env:
              - name: IMAGE_REF
                value: $(params.IMAGE_REF)
              - name: IMAGE_URL
                value: $(params.IMAGE_URL)
              - name: SBOM_BLOB_URL
                value: $(params.SBOM_BLOB_URL)
            image: quay.io/konflux-ci/task-runner:3.1.1@sha256:790df1bb5ea7a9ce4c1717ff341398ff72c99faed1c2e939a3b4a15ff8f4a493
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "Confirm we can inspect the image with an archful tag"
              skopeo inspect --tls-verify=false "docker://${IMAGE_REF//:latest-linux-s390x/}"

              echo "Confirm the image is single-arch; multiarch not supported"
              mediaType=$(skopeo inspect --tls-verify=false --raw "docker://${IMAGE_REF//:latest-linux-s390x/}" | jq -r .mediaType)
              if [ "$mediaType" != "application/vnd.oci.image.manifest.v1+json" ]; then
                  echo "Image is not single-arch." && exit 1
              fi

              echo "Confirm the image is s390x - the one we asked for"
              mediaType=$(skopeo inspect --tls-verify=false "docker://${IMAGE_REF//:latest-linux-s390x/}" | jq -r .Architecture)
              if [ "$mediaType" != "s390x" ]; then
                  echo "Image is not s390x." && exit 1
              fi

              echo "Confirm the contents of the filesystem"
              mkdir contents/ && pushd contents/
              oc image extract --insecure=true "$IMAGE_REF"
              for filename in usr/bin/ls models/model.bin; do
                if [ -f "$filename" ]; then
                    echo "File $filename found as expected."
                else
                    echo "File $filename not found!" && exit 1
                fi
              done
              popd

              echo "Confirm the sbom exists as json"
              packages=$(cosign download sbom --allow-insecure-registry "$IMAGE_REF" | jq -r '.packages[].externalRefs[].referenceLocator')
              for purl in pkg:oci/test-modelcar pkg:oci/ubi pkg:oci/test-model; do
                if [[ "$packages" == *"${purl}@sha256"* ]]; then
                  echo "$purl found as expected."
                else
                  echo "$purl not found in $packages" && exit 1
                fi
              done
      runAfter:
        - run-modelcar-task
