---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: validate-label-semver
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: "konflux"
spec:
  description: >-
    Validates the version label on a container image against a declared semver
    pattern. The VERSION_PATTERN parameter defines the expected structure using
    named placeholders (e.g., {MAJOR}.{MINOR}.{PATCH}). The task counts the
    dot-separated numeric segments in the label and fails if they don't match
    the pattern. Consistent version formatting is critical because downstream
    tools use the version label to construct Package URLs (PURLs) for CVE
    scanning. If the version structure changes unexpectedly, scanners cannot
    reliably match affected package versions against known vulnerabilities.
  params:
    - name: IMAGE_URL
      description: Image repository and tag reference of the built image.
      type: string
    - name: IMAGE_DIGEST
      description: Image digest of the built image.
      type: string
    - name: VERSION_PATTERN
      description: >-
        Declares the expected version structure using dot-separated named
        placeholders. Each placeholder represents one required numeric segment.
        Teams with non-standard versioning must set this to match their scheme.
      type: string
      default: "{MAJOR}.{MINOR}.{PATCH}"
    - name: LABEL_KEY
      description: The label key to validate.
      type: string
      default: "version"
    - name: CA_TRUST_CONFIG_MAP_NAME
      type: string
      description: The name of the ConfigMap to read CA bundle data from.
      default: trusted-ca
    - name: CA_TRUST_CONFIG_MAP_KEY
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      default: ca-bundle.crt
  results:
    - name: LABEL_VALUE
      description: The extracted label value from the current image.
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
        subPath: ca-bundle.crt
        readOnly: true
  steps:
    - name: validate
      image: quay.io/konflux-ci/task-runner:2.0.0@sha256:4b01fbf98fa7155f5c21443c285f88853864ae7cc66981cf6b543fc6ba16b81b
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 64Mi
      env:
        - name: IMAGE_URL
          value: $(params.IMAGE_URL)
        - name: IMAGE_DIGEST
          value: $(params.IMAGE_DIGEST)
        - name: VERSION_PATTERN
          value: $(params.VERSION_PATTERN)
        - name: LABEL_KEY
          value: $(params.LABEL_KEY)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Count {PLACEHOLDER} tokens in the pattern to determine expected segments.
        expected_segment_count=$(grep -o '{[^}]*}' <<< "$VERSION_PATTERN" | wc -l)

        if [[ "$expected_segment_count" -lt 1 ]]; then
          echo "ERROR: VERSION_PATTERN '${VERSION_PATTERN}' contains no {PLACEHOLDER} tokens."
          exit 1
        fi

        echo "Version pattern: ${VERSION_PATTERN} (expecting ${expected_segment_count} numeric segment(s))"

        # Count dot-separated numeric version segments in a label value.
        # Stops at the first segment containing a dash (build metadata)
        # or a 10+ digit number (timestamp).
        extract_version_segment_count() {
          local label_value="$1"
          IFS='.' read -ra all_segments <<< "$label_value"

          local count=0
          for seg in "${all_segments[@]}"; do
            if [[ "$seg" == *-* ]]; then
              break
            fi
            if [[ "$seg" =~ ^[0-9]{10,}$ ]]; then
              break
            fi
            if [[ "$seg" =~ ^[0-9]+$ ]]; then
              count=$((count + 1))
            else
              break
            fi
          done

          echo "$count"
        }

        echo "Inspecting image: docker://${IMAGE_URL}@${IMAGE_DIGEST}"
        current_label=$(skopeo inspect --no-tags "docker://${IMAGE_URL}@${IMAGE_DIGEST}" \
          | jq -r --arg key "$LABEL_KEY" '.Labels[$key] // empty')

        if [[ -z "${current_label}" ]]; then
          echo "ERROR: Label '${LABEL_KEY}' not found on image ${IMAGE_URL}@${IMAGE_DIGEST}."
          exit 1
        fi

        echo "Found label ${LABEL_KEY}=${current_label}"
        printf '%s' "$current_label" > "$(results.LABEL_VALUE.path)"

        actual_segment_count=$(extract_version_segment_count "$current_label")

        if [[ "$actual_segment_count" -ne "$expected_segment_count" ]]; then
          echo "ERROR: Label '${LABEL_KEY}' value '${current_label}' has ${actual_segment_count} version segment(s), but pattern '${VERSION_PATTERN}' requires ${expected_segment_count}."
          echo "Mismatched version structure breaks PURL consistency, which prevents CVE scanners from reliably matching affected package versions."
          exit 1
        fi

        echo "SUCCESS: Label '${LABEL_KEY}' value '${current_label}' matches pattern '${VERSION_PATTERN}' (${actual_segment_count} segment(s))."
  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.CA_TRUST_CONFIG_MAP_NAME)
        items:
          - key: $(params.CA_TRUST_CONFIG_MAP_KEY)
            path: ca-bundle.crt
        optional: true