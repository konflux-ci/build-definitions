---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-maven-zip
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: "maven-build, konflux"
  labels:
    app.kubernetes.io/version: "0.2"
    build.appstudio.redhat.com/build_type: "maven-zip"
spec:
  description: |-
    Build-maven-zip task builds prefetched maven and npm artifacts into OCI-artifact and pushes the OCI-artifact into container registry.
    In addition it will use the SBOM file in prefetch-task, pushes the SBOM file to same registry of tar oci-artifact using cosign tool.
    Note that this task needs the output of prefetch-dependencies task. If it is not activated, there will not be any output from this task.
  params:
  - description: Reference of the OCI-Artifact this build task will produce.
    name: IMAGE
    type: string
  - default: "package"
    description: The root directory of the artifacts under the prefetched directory. Will be kept in the npm tar as the top directory for all artifacts.
    name: PREFETCH_ROOT
    type: string
  - default: ""
    description: Delete image tag after specified time. Empty means to keep the image tag. Time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: EXPIRES_AFTER
    type: string
  - name: caTrustConfigMapName
    type: string
    description: The name of the ConfigMap to read CA bundle data from.
    default: trusted-ca
  - name: caTrustConfigMapKey
    type: string
    description: The name of the key in the ConfigMap that contains the CA bundle data.
    default: ca-bundle.crt
  - name: SBOM_SKIP_VALIDATION
    description: Flag to enable or disable SBOM validation before save. Validation is optional - use this if you are experiencing performance issues.
    type: string
    default: "false"
  results:
  - description: Digest of the OCI-Artifact just built
    name: IMAGE_DIGEST
  - description: OCI-Artifact repository and tag where the built OCI-Artifact was pushed
    name: IMAGE_URL
  - description: OCI-Artifact reference of the built OCI-Artifact
    name: IMAGE_REF
  - name: SBOM_BLOB_URL
    description: Reference of SBOM blob digest to enable digest-based verification from provenance
    type: string
  - name: TARBALL_FILES
    description: List of tarball files to be pushed as OCI
    type: string
  stepTemplate:
    env:
    - name: IMAGE
      value: $(params.IMAGE)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.EXPIRES_AFTER)
    - name: SBOM_SKIP_VALIDATION
      value: $(params.SBOM_SKIP_VALIDATION)
    volumeMounts:
      - mountPath: /shared
        name: shared

  steps:
  - image: quay.io/konflux-ci/appstudio-utils:1610c1fc4cfc9c9053dbefc1146904a4df6659ef@sha256:90ac97b811073cb99a23232c15a08082b586c702b85da6200cf54ef505e3c50c
    name: prepare
    computeResources:
      limits:
        memory: 8Gi
      requests:
        memory: 2Gi
        cpu: '1'
    script: |
      #!/bin/bash
      set -euo pipefail
      pkgpath="$(workspaces.source.path)/cachi2/output/deps/generic"
      if [ -d "$pkgpath" ]; then
        cd "$pkgpath"
        tarball_files=$(find . -maxdepth 1 -type f)
        echo -n "$tarball_files" >"$(results.TARBALL_FILES.path)"
        tarball_count="$(echo "$tarball_files" | wc -l)"
        echo "Found $tarball_count file(s) in $pkgpath"

        if [ "$tarball_count" -gt 0 ]; then
          echo "$tarball_files"
          mkdir -p "/shared"
          mv -- * "/shared"
        else
          echo "No files found in $pkgpath!"
          exit 1
        fi
      else
        echo "No $pkgpath dir found!"
        exit 1
      fi
    securityContext:
      capabilities:
        add:
          - SETFCAP
      runAsUser: 0
      runAsNonRoot: false
    workingDir: $(workspaces.source.path)
  - image: quay.io/konflux-ci/oras:latest@sha256:4542f5a2a046ca36653749a8985e46744a5d2d36ee10ca14409be718ce15129e
    name: build
    computeResources:
      limits:
        memory: 8Gi
      requests:
        memory: 2Gi
        cpu: '1'
    script: |
      #!/bin/bash
      set -euo pipefail
      tarball_files="$(cat "$(results.TARBALL_FILES.path)")"
      tarball_count=$(echo "$tarball_files" | wc -l)

      echo "Found $tarball_count file(s) in /shared"
      if [ "$tarball_count" -gt 0 ]; then
        echo "$tarball_files"
        mv "/shared"/* "./"
        select-oci-auth "$IMAGE" >auth.json

        echo "Pushing image ${IMAGE} to registry"

        oras_args=(push "$IMAGE" --registry-config auth.json)

        if [ -n "$IMAGE_EXPIRES_AFTER" ]; then
          oras_args+=(--annotation "quay.expires-after=$IMAGE_EXPIRES_AFTER")
        fi

        for tarball_file in $tarball_files; do
          file_type=$(file -b "$tarball_file")
          if [[ "$file_type" =~ "Zip archive data" ]]; then
            artifact_type="application/vnd.maven+zip"
          elif [[ "$file_type" =~ "gzip compressed data" ]]; then
            artifact_type="application/vnd.npm+tar+gzip"
          else
            echo "Warning: Unknown file type for $tarball_file: $file_type"
            artifact_type="application/gzip"
          fi
          echo "Detected $tarball_file as $artifact_type (file type: $file_type)"
          oras_args+=("${tarball_file}:${artifact_type}")
        done

        echo "Executing: retry oras ${oras_args[*]}"
        if ! retry oras "${oras_args[@]}"; then
          echo "Failed to push image ${IMAGE} to registry"
          exit 1
        fi
        if ! RESULTING_DIGEST=$(retry oras resolve --registry-config auth.json "${IMAGE}"); then
          echo "Failed to get digest for ${IMAGE} from registry"
          exit 1
        fi
        echo -n "$IMAGE" | tee "$(results.IMAGE_URL.path)"
        echo -n "$RESULTING_DIGEST" | tee "$(results.IMAGE_DIGEST.path)"
        echo -n "${IMAGE}@${RESULTING_DIGEST}" | tee "$(results.IMAGE_REF.path)"
      else
        echo "No files found!"
        exit 1
      fi
    securityContext:
      capabilities:
        add:
          - SETFCAP
      runAsUser: 0
      runAsNonRoot: false
    volumeMounts:
    - name: trusted-ca
      mountPath: /mnt/trusted-ca
      readOnly: true
    workingDir: $(workspaces.source.path)
  - image: quay.io/konflux-ci/mobster:1.1.0-1768294847@sha256:ff738d9032c9885731bc96383e720ced2469649fa7148b76b58b7492c9bb82b8
    name: save-sbom
    computeResources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
        cpu: 100m
    script: |
      #!/bin/bash
      set -euo pipefail

      IMAGE_URL="$(cat "$(results.IMAGE_URL.path)")"
      IMAGE_DIGEST="$(cat "$(results.IMAGE_DIGEST.path)")"

      # Use Mobster to generate npm-tar SBOM file using the Hermeto (Cachi2) output
      if [ -f "$(workspaces.source.path)/cachi2/output/bom.json" ]; then
        mobster_args=(generate --output sbom.json)
        if [ "${SBOM_SKIP_VALIDATION}" == "true" ]; then
          echo "Skipping SBOM validation"
          mobster_args+=(--skip-validation)
        fi
        mobster_args+=(
          oci-image
          --from-hermeto "$(workspaces.source.path)/cachi2/output/bom.json"
          --image-pullspec "$IMAGE_URL"
          --image-digest "$IMAGE_DIGEST"
        )
        mobster "${mobster_args[@]}"
      else
        echo "The SBOM file for fetched artifacts is not found!"
        exit 1
      fi
    securityContext:
      capabilities:
        add:
          - SETFCAP
    volumeMounts:
    - name: trusted-ca
      mountPath: /mnt/trusted-ca
      readOnly: true
    workingDir: $(workspaces.source.path)
  - name: upload-sbom
    image: quay.io/konflux-ci/appstudio-utils:1610c1fc4cfc9c9053dbefc1146904a4df6659ef@sha256:90ac97b811073cb99a23232c15a08082b586c702b85da6200cf54ef505e3c50c
    script: |
      #!/bin/bash
      set -euo pipefail
      ca_bundle=/mnt/trusted-ca/ca-bundle.crt
      if [ -f "$ca_bundle" ]; then
        echo "INFO: Using mounted CA bundle: $ca_bundle"
        cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors
        update-ca-trust
      fi

      if jq -e '.bomFormat == "CycloneDX"' < sbom.json >/dev/null; then
        sbom_type=cyclonedx
      else
        sbom_type=spdx
      fi

      echo "Pushing sbom to registry"
      if ! retry cosign attach sbom --sbom sbom.json --type "$sbom_type" "$IMAGE"
      then
          echo "Failed to push sbom to registry"
          exit 1
      fi

      # Remove tag from IMAGE while allowing registry to contain a port number.
      sbom_repo="${IMAGE%:*}"
      sbom_tag="sha256-$(< "$(results.IMAGE_DIGEST.path)" cut -d: -f2).sbom"
      # The SBOM_BLOB_URL is created by `cosign attach sbom`.
      echo -n "${sbom_repo}:${sbom_tag}" | tee "$(results.SBOM_BLOB_URL.path)"
    computeResources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
        cpu: 100m
    volumeMounts:
    - name: trusted-ca
      mountPath: /mnt/trusted-ca
      readOnly: true
    workingDir: $(workspaces.source.path)
    securityContext:
      runAsUser: 0
      runAsNonRoot: false

  volumes:
  - name: shared
    emptyDir: {}
  - name: trusted-ca
    configMap:
      name: $(params.caTrustConfigMapName)
      items:
        - key: $(params.caTrustConfigMapKey)
          path: ca-bundle.crt
      optional: true
  workspaces:
  - name: source
    description: Workspace containing the source code to build.
