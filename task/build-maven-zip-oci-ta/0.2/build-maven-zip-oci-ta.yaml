---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-maven-zip-oci-ta
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: maven-build, konflux
  labels:
    app.kubernetes.io/version: "0.2"
    build.appstudio.redhat.com/build_type: maven-zip
spec:
  description: |-
    Build-maven-zip task builds prefetched maven and npm artifacts into a OCI-artifact with zip bundle  and pushes the OCI-artifact into container registry.
    In addition it will use the SBOM file in prefetch-task, pushes the SBOM file to same registry of zip oci-artifact using cosign tool.
    Note that this task needs the output of prefetch-dependencies task. If it is not activated, there will not be any output from this task.
  params:
    - name: CACHI2_ARTIFACT
      description: The Trusted Artifact URI pointing to the artifact with
        the prefetched dependencies.
      type: string
      default: ""
    - name: EXPIRES_AFTER
      description: Delete image tag after specified time. Empty means to keep
        the image tag. Time values could be something like 1h, 2d, 3w for
        hours, days, and weeks, respectively.
      type: string
      default: ""
    - name: IMAGE
      description: Reference of the OCI-Artifact this build task will produce.
      type: string
    - name: SBOM_SKIP_VALIDATION
      description: Flag to enable or disable SBOM validation before save.
        Validation is optional - use this if you are experiencing performance
        issues.
      type: string
      default: "false"
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the
        CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
  results:
    - name: IMAGE_DIGEST
      description: Digest of the OCI-Artifact just built
    - name: IMAGE_REF
      description: OCI-Artifact reference of the built OCI-Artifact
    - name: IMAGE_URL
      description: OCI-Artifact repository and tag where the built OCI-Artifact
        was pushed
    - name: SBOM_BLOB_URL
      description: Reference of SBOM blob digest to enable digest-based verification
        from provenance
      type: string
    - name: TARBALL_FILES
      description: List of tarball files to be pushed as OCI
      type: string
  volumes:
    - name: shared
      emptyDir: {}
    - name: trusted-ca
      configMap:
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        name: $(params.caTrustConfigMapName)
        optional: true
    - name: workdir
      emptyDir: {}
  stepTemplate:
    env:
      - name: IMAGE
        value: $(params.IMAGE)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.EXPIRES_AFTER)
      - name: SBOM_SKIP_VALIDATION
        value: $(params.SBOM_SKIP_VALIDATION)
    volumeMounts:
      - mountPath: /shared
        name: shared
      - mountPath: /var/workdir
        name: workdir
  steps:
    - name: use-trusted-artifact
      image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:90a188e90bf8f33cf93016bcfdfd0a3a9e7df6ff13691f001a0ed4f014060e2e
      args:
        - use
        - $(params.CACHI2_ARTIFACT)=/var/workdir/cachi2
    - name: prepare
      image: quay.io/konflux-ci/task-runner:1.5.0@sha256:200019314a50be5b6dd06f362c794c92a700583a522c5eee9a41e3eab7f706c5
      workingDir: /var/workdir
      script: |
        #!/bin/bash
        set -euo pipefail
        pkgpath="/var/workdir/cachi2/output/deps/generic"
        if [ -d "$pkgpath" ]; then
          cd "$pkgpath"
          tarball_files=$(find . -maxdepth 1 -type f)
          if [ -z "$tarball_files" ]; then
            echo "No files found in $pkgpath!"
            exit 1
          fi
          echo -n "$tarball_files" >"$(results.TARBALL_FILES.path)"
          echo "Found $(echo "$tarball_files" | wc -l) file(s) in $pkgpath"
          echo "$tarball_files"
          mkdir -p "/shared"
          mv -- * "/shared"
        else
          echo "No $pkgpath dir found!"
          exit 1
        fi
      computeResources:
        limits:
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 2Gi
      securityContext:
        capabilities:
          add:
            - SETFCAP
        runAsNonRoot: false
        runAsUser: 0
    - name: build
      image: quay.io/konflux-ci/task-runner:1.5.0@sha256:200019314a50be5b6dd06f362c794c92a700583a522c5eee9a41e3eab7f706c5
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
      script: |
        #!/bin/bash
        set -euo pipefail
        tarball_files="$(cat "$(results.TARBALL_FILES.path)")"
        if [ -z "$tarball_files" ]; then
          echo "No files found!"
          exit 1
        fi

        echo "Found $(echo "$tarball_files" | wc -l) file(s) in /shared"
        echo "$tarball_files"
        mv "/shared"/* "./"
        select-oci-auth "$IMAGE" >auth.json

        echo "Pushing image ${IMAGE} to registry"

        oras_args=(push "$IMAGE" --registry-config auth.json --artifact-type application/vnd.konflux.build-archive)

        if [ -n "$IMAGE_EXPIRES_AFTER" ]; then
          oras_args+=(--annotation "quay.expires-after=$IMAGE_EXPIRES_AFTER")
        fi

        while IFS= read -r tarball_file; do
          [ -z "$tarball_file" ] && continue
          file_type=$(file -b "$tarball_file")
          if [[ "$file_type" =~ "Zip archive data" ]]; then
            artifact_type="application/vnd.maven+zip"
          elif [[ "$file_type" =~ "gzip compressed data" ]]; then
            artifact_type="application/vnd.npm+tar+gzip"
          else
            echo "Warning: Unknown file type for $tarball_file: $file_type"
            artifact_type="application/gzip"
          fi
          echo "Detected $tarball_file as $artifact_type (file type: $file_type)"
          oras_args+=("${tarball_file}:${artifact_type}")
        done <<< "$tarball_files"

        echo "Executing: retry oras ${oras_args[*]}"
        if ! retry oras "${oras_args[@]}"; then
          echo "Failed to push image ${IMAGE} to registry"
          exit 1
        fi
        if ! RESULTING_DIGEST=$(retry oras resolve --registry-config auth.json "${IMAGE}"); then
          echo "Failed to get digest for ${IMAGE} from registry"
          exit 1
        fi
        echo -n "$IMAGE" | tee "$(results.IMAGE_URL.path)"
        echo -n "$RESULTING_DIGEST" | tee "$(results.IMAGE_DIGEST.path)"
        echo -n "${IMAGE}@${RESULTING_DIGEST}" | tee "$(results.IMAGE_REF.path)"
      computeResources:
        limits:
          memory: 8Gi
        requests:
          cpu: "1"
          memory: 2Gi
      securityContext:
        capabilities:
          add:
            - SETFCAP
        runAsNonRoot: false
        runAsUser: 0
    - name: save-sbom
      image: quay.io/konflux-ci/mobster:1.2.1-1782136886@sha256:1374bc35c71781987cce00ef5efe2be42923f83def19b60a570e947189b90d15
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
      script: |
        #!/bin/bash
        set -euo pipefail

        IMAGE_URL="$(cat "$(results.IMAGE_URL.path)")"
        IMAGE_DIGEST="$(cat "$(results.IMAGE_DIGEST.path)")"

        # Use Mobster to generate npm-tar SBOM file using the Hermeto (Cachi2) output
        if [ -f "/var/workdir/cachi2/output/bom.json" ]; then
          mobster_args=(generate --output sbom.json)
          if [ "${SBOM_SKIP_VALIDATION}" == "true" ]; then
            echo "Skipping SBOM validation"
            mobster_args+=(--skip-validation)
          fi
          mobster_args+=(
            oci-image
            --from-hermeto "/var/workdir/cachi2/output/bom.json"
            --image-pullspec "$IMAGE_URL"
            --image-digest "$IMAGE_DIGEST"
          )
          mobster "${mobster_args[@]}"
        else
          echo "The SBOM file for fetched artifacts is not found!"
          exit 1
        fi
      computeResources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      securityContext:
        capabilities:
          add:
            - SETFCAP
    - name: upload-sbom
      image: quay.io/konflux-ci/task-runner:1.5.0@sha256:200019314a50be5b6dd06f362c794c92a700583a522c5eee9a41e3eab7f706c5
      workingDir: /var/workdir
      volumeMounts:
        - mountPath: /mnt/trusted-ca
          name: trusted-ca
          readOnly: true
      script: |
        #!/bin/bash
        set -euo pipefail
        ca_bundle=/mnt/trusted-ca/ca-bundle.crt
        if [ -f "$ca_bundle" ]; then
          echo "INFO: Using mounted CA bundle: $ca_bundle"
          cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors
          update-ca-trust
        fi

        if jq -e '.bomFormat == "CycloneDX"' <sbom.json >/dev/null; then
          sbom_type=cyclonedx
        else
          sbom_type=spdx
        fi

        echo "Pushing sbom to registry"
        if ! retry cosign attach sbom --sbom sbom.json --type "$sbom_type" "$IMAGE"; then
          echo "Failed to push sbom to registry"
          exit 1
        fi

        # Remove tag from IMAGE while allowing registry to contain a port number.
        sbom_repo="${IMAGE%:*}"
        sbom_tag="sha256-$(                                <"$(results.IMAGE_DIGEST.path)" cut -d: -f2).sbom"
        # The SBOM_BLOB_URL is created by `cosign attach sbom`.
        echo -n "${sbom_repo}:${sbom_tag}" | tee "$(results.SBOM_BLOB_URL.path)"
      computeResources:
        limits:
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
