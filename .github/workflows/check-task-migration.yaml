name: Check task migrations
"on":
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kind
      - uses: tektoncd/actions/setup-tektoncd@cd4768a594ec4a7af8ef72d73524a584cb564e34 # main
        with:
          pipeline_version: v1.14.0
      - name: Run check
        run: |
          DEBIAN_FRONTEND=noninteractive \
          sudo apt-get install -y --no-install-recommends \
              tzdata python3-ruamel.yaml
          pip install git+https://github.com/konflux-ci/pipeline-migration-tool --user

          kubectl get all -n tekton-pipelines
          # Require name main
          git branch main origin/main
          # Make `git branch --show-current` works.
          git checkout -b pr-verify
          export IN_CLUSTER=1
          bash ./hack/validate-migration.sh
